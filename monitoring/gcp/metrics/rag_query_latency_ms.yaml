name: 'rag_query_latency_ms'
description: 'End-to-end agent latency (uncached queries)'
filter: '__BASE_FILTER__ AND (jsonPayload.event="query_completed" AND NOT jsonPayload.cached=true)'
valueExtractor: 'EXTRACT(jsonPayload.latency_ms)'
metricDescriptor:
  metricKind: "DELTA"
  valueType: "DISTRIBUTION"
  unit: "ms"
  labels:
    - key: route
      valueType: STRING
labelExtractors:
  route: "EXTRACT(jsonPayload.route)"
bucketOptions:
  exponentialBuckets:
    numFiniteBuckets: 30
    growthFactor: 1.35
    scale: 50
