name: 'rag_query_cost_usd'
description: 'Estimated LLM cost per query in USD'
filter: '__BASE_FILTER__ AND (jsonPayload.event="query_completed" AND NOT jsonPayload.cached=true)'
valueExtractor: 'EXTRACT(jsonPayload.cost_usd)'
metricDescriptor:
  metricKind: "DELTA"
  valueType: "DISTRIBUTION"
  unit: "USD"
  labels:
    - key: route
      valueType: STRING
labelExtractors:
  route: "EXTRACT(jsonPayload.route)"
bucketOptions:
  exponentialBuckets:
    numFiniteBuckets: 20
    growthFactor: 2
    scale: 1e-05
